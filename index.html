<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoGas Menu Manager</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .outlet, .menu {
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .success {
      color: green;
      margin-top: 10px;
    }

    .error {
      color: red;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="loginPage" class="card">
    <h1>🛵 GoGas</h1>
    <h2>Login Admin</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">🔐 Login</button>

    <div id="loginMessage"></div>
  </div>


  <div id="dashboard" class="hidden">

    <div class="card">
      <h1>🛵 GoGas Menu Manager</h1>
      <p>Dashboard Admin</p>
      <button onclick="logout()">🚪 Logout</button>
    </div>


    <div class="card">
      <h2>🏪 Tambah Outlet</h2>

      <input id="outletName" placeholder="Nama outlet">
      <input id="outletAddress" placeholder="Alamat outlet">
      <input id="outletPhone" placeholder="Nomor HP">

      <button onclick="addOutlet()">💾 Simpan Outlet</button>

      <div id="outletMessage"></div>
    </div>


    <div class="card">
      <h2>🏪 Daftar Outlet</h2>
      <div id="outletList">Memuat outlet...</div>
    </div>


    <div class="card">
      <h2>🍔 Tambah Menu</h2>

      <label>Pilih Outlet</label>
      <select id="menuOutlet">
        <option value="">-- Pilih Outlet --</option>
      </select>

      <input id="menuName" placeholder="Nama menu">

      <input
        id="menuPrice"
        type="number"
        placeholder="Harga"
      >

      <textarea
        id="menuDescription"
        placeholder="Deskripsi menu"
        rows="3"
      ></textarea>

      <button onclick="addMenu()">💾 Simpan Menu</button>

      <div id="menuMessage"></div>
    </div>


    <div class="card">
      <h2>🍔 Daftar Menu</h2>
      <div id="menuList">Pilih outlet untuk melihat menu.</div>
    </div>

  </div>

</div>


<script>

  const SUPABASE_URL = "https://kigawlittgslscbnmngq.supabase.co";

  const SUPABASE_KEY = "sb_publishable_kSluzLhdTM_CVj5A9PAIvA_oJqKFK8G";

  const MERCHANT_ID = "01b6caa0-e1bb-49d5-906b-68bd2fb1b58a";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  async function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const message = document.getElementById("loginMessage");

    message.innerHTML = "Sedang login...";

    const { error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      message.innerHTML =
        '<p class="error">❌ ' + error.message + '</p>';
      return;
    }

    message.innerHTML =
      '<p class="success">✅ Login berhasil.</p>';

    showDashboard();
  }


  async function logout() {

    await db.auth.signOut();

    document.getElementById("dashboard")
      .classList.add("hidden");

    document.getElementById("loginPage")
      .classList.remove("hidden");
  }


  async function showDashboard() {

    document.getElementById("loginPage")
      .classList.add("hidden");

    document.getElementById("dashboard")
      .classList.remove("hidden");

    await loadOutlets();
  }


  async function addOutlet() {

    const name =
      document.getElementById("outletName").value.trim();

    const address =
      document.getElementById("outletAddress").value.trim();

    const phone =
      document.getElementById("outletPhone").value.trim();

    const message =
      document.getElementById("outletMessage");

    if (!name) {
      message.innerHTML =
        '<p class="error">❌ Nama outlet wajib diisi.</p>';
      return;
    }

    const { error } = await db
      .from("outlets")
      .insert({
        merchant_id: MERCHANT_ID,
        name: name,
        address: address,
        phone: phone,
        is_open: true
      });

    if (error) {
      message.innerHTML =
        '<p class="error">❌ ' + error.message + '</p>';
      return;
    }

    message.innerHTML =
      '<p class="success">✅ Outlet berhasil ditambahkan.</p>';

    document.getElementById("outletName").value = "";
    document.getElementById("outletAddress").value = "";
    document.getElementById("outletPhone").value = "";

    await loadOutlets();
  }


  async function loadOutlets() {

    const outletList =
      document.getElementById("outletList");

    const menuOutlet =
      document.getElementById("menuOutlet");

    const { data, error } = await db
      .from("outlets")
      .select("*")
      .eq("merchant_id", MERCHANT_ID)
      .order("created_at", { ascending: true });

    if (error) {
      outletList.innerHTML =
        '<p class="error">❌ ' + error.message + '</p>';
      return;
    }

    outletList.innerHTML = "";

    menuOutlet.innerHTML =
      '<option value="">-- Pilih Outlet --</option>';

    if (!data || data.length === 0) {

      outletList.innerHTML =
        "<p>Belum ada outlet.</p>";

      return;
    }

    data.forEach(outlet => {

      const div = document.createElement("div");

      div.className = "outlet";

      div.innerHTML = `
        <strong>🏪 ${escapeHtml(outlet.name)}</strong>
        <br>
        📍 ${escapeHtml(outlet.address || "-")}
        <br>
        📞 ${escapeHtml(outlet.phone || "-")}
        <br>
        Status: ${outlet.is_open ? "🟢 Buka" : "🔴 Tutup"}
      `;

      outletList.appendChild(div);


      const option =
        document.createElement("option");

      option.value = outlet.id;
      option.textContent = outlet.name;

      menuOutlet.appendChild(option);

    });
  }


  async function addMenu() {

    const outletId =
      document.getElementById("menuOutlet").value;

    const name =
      document.getElementById("menuName").value.trim();

    const price =
      document.getElementById("menuPrice").value;

    const description =
      document.getElementById("menuDescription").value.trim();

    const message =
      document.getElementById("menuMessage");

    if (!outletId) {
      message.innerHTML =
        '<p class="error">❌ Pilih outlet terlebih dahulu.</p>';
      return;
    }

    if (!name) {
      message.innerHTML =
        '<p class="error">❌ Nama menu wajib diisi.</p>';
      return;
    }

    if (!price) {
      message.innerHTML =
        '<p class="error">❌ Harga menu wajib diisi.</p>';
      return;
    }

    const { error } = await db
      .from("menus")
      .insert({
        outlet_id: outletId,
        name: name,
        price: Number(price),
        description: description,
        is_available: true
      });

    if (error) {
      message.innerHTML =
        '<p class="error">❌ ' + error.message + '</p>';
      return;
    }

    message.innerHTML =
      '<p class="success">✅ Menu berhasil ditambahkan.</p>';

    document.getElementById("menuName").value = "";
    document.getElementById("menuPrice").value = "";
    document.getElementById("menuDescription").value = "";

    await loadMenus(outletId);
  }


  document
    .getElementById("menuOutlet")
    .addEventListener("change", function() {

      const outletId = this.value;

      if (outletId) {
        loadMenus(outletId);
      } else {
        document.getElementById("menuList").innerHTML =
          "Pilih outlet untuk melihat menu.";
      }

    });


  async function loadMenus(outletId) {

    const menuList =
      document.getElementById("menuList");

    menuList.innerHTML = "Memuat menu...";

    const { data, error } = await db
      .from("menus")
      .select("*")
      .eq("outlet_id", outletId)
      .order("created_at", { ascending: true });

    if (error) {
      menuList.innerHTML =
        '<p class="error">❌ ' + error.message + '</p>';
      return;
    }

    if (!data || data.length === 0) {
      menuList.innerHTML =
        "<p>Belum ada menu di outlet ini.</p>";
      return;
    }

    menuList.innerHTML = "";

    data.forEach(menu => {

      const div = document.createElement("div");

      div.className = "menu";

      div.innerHTML = `
        <strong>🍔 ${escapeHtml(menu.name)}</strong>
        <br>
        💰 Rp ${Number(menu.price || 0).toLocaleString("id-ID")}
        <br>
        📝 ${escapeHtml(menu.description || "-")}
        <br>
        Status: ${menu.is_available ? "🟢 Tersedia" : "🔴 Tidak tersedia"}
      `;

      menuList.appendChild(div);

    });
  }


  function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text || "";

    return div.innerHTML;
  }


  async function checkSession() {

    const { data } =
      await db.auth.getSession();

    if (data.session) {
      showDashboard();
    }

  }


  checkSession();

</script>

</body>
</html>
