<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoGas Menu Manager</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    .item {
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .photo-preview {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin-top: 8px;
    }

    .logout {
      background: #c62828;
    }

    .status {
      padding: 10px;
      background: #eee;
      border-radius: 8px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginPage" class="card">
    <h1>GoGas Menu Manager</h1>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <div id="loginMessage"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">
      <h1>GoGas Menu Manager</h1>

      <div id="userInfo" class="status"></div>

      <button class="logout" onclick="logout()">Logout</button>
    </div>


    <!-- TAMBAH OUTLET -->
    <div class="card">
      <h2>Tambah Outlet</h2>

      <input
        type="text"
        id="outletName"
        placeholder="Nama outlet"
      >

      <input
        type="text"
        id="outletAddress"
        placeholder="Alamat"
      >

      <input
        type="text"
        id="outletPhone"
        placeholder="Nomor HP"
      >

      <button onclick="addOutlet()">Tambah Outlet</button>

      <div id="outletMessage"></div>
    </div>


    <!-- DAFTAR OUTLET -->
    <div class="card">
      <h2>Daftar Outlet</h2>

      <div id="outletList">
        Memuat outlet...
      </div>
    </div>


    <!-- TAMBAH MENU -->
    <div class="card">
      <h2>Tambah Menu</h2>

      <select id="menuOutlet">
        <option value="">Pilih outlet</option>
      </select>

      <input
        type="text"
        id="menuName"
        placeholder="Nama menu"
      >

      <input
        type="number"
        id="menuPrice"
        placeholder="Harga"
      >

      <textarea
        id="menuDescription"
        placeholder="Deskripsi menu"
        rows="4"
      ></textarea>

      <label>
        Foto Menu
      </label>

      <input
        type="file"
        id="menuImage"
        accept="image/*"
      >

      <button onclick="addMenu()">Tambah Menu</button>

      <div id="menuMessage"></div>
    </div>


    <!-- DAFTAR MENU -->
    <div class="card">
      <h2>Daftar Menu</h2>

      <div id="menuList">
        Memuat menu...
      </div>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://kigawlittgslscbnmngq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kSluzLhdTM_CVj5A9PAIvA_oJqKFK8G";

const MERCHANT_ID =
  "01b6caa0-e1bb-49d5-906b-68bd2fb1b58a";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// =========================
// LOGIN
// =========================

async function login() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.innerHTML = "Login...";

  const { data, error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message.innerHTML =
      "Login gagal: " + error.message;
    return;
  }

  message.innerHTML = "";

  showDashboard();
}


// =========================
// LOGOUT
// =========================

async function logout() {

  await db.auth.signOut();

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");
}


// =========================
// CEK LOGIN
// =========================

async function checkSession() {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (session) {
    showDashboard();
  } else {
    document
      .getElementById("loginPage")
      .classList.remove("hidden");

    document
      .getElementById("dashboard")
      .classList.add("hidden");
  }
}


// =========================
// DASHBOARD
// =========================

async function showDashboard() {

  const {
    data: { session }
  } = await db.auth.getSession();

  if (!session) return;

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  document.getElementById("userInfo").innerHTML =
    "Login sebagai: " + session.user.email;

  loadOutlets();
  loadMenus();
}


// =========================
// TAMBAH OUTLET
// =========================

async function addOutlet() {

  const name =
    document.getElementById("outletName").value;

  const address =
    document.getElementById("outletAddress").value;

  const phone =
    document.getElementById("outletPhone").value;

  const message =
    document.getElementById("outletMessage");

  if (!name) {
    message.innerHTML =
      "Nama outlet wajib diisi.";
    return;
  }

  const { error } =
    await db
      .from("outlets")
      .insert({
        merchant_id: MERCHANT_ID,
        name: name,
        address: address,
        phone: phone,
        is_open: true
      });

  if (error) {

    message.innerHTML =
      "Gagal: " + error.message;

    return;
  }

  message.innerHTML =
    "Outlet berhasil ditambahkan.";

  document.getElementById("outletName").value = "";
  document.getElementById("outletAddress").value = "";
  document.getElementById("outletPhone").value = "";

  loadOutlets();
}


// =========================
// LOAD OUTLET
// =========================

async function loadOutlets() {

  const {
    data,
    error
  } = await db
    .from("outlets")
    .select("*")
    .eq("merchant_id", MERCHANT_ID)
    .order("created_at", {
      ascending: false
    });

  const list =
    document.getElementById("outletList");

  const select =
    document.getElementById("menuOutlet");

  if (error) {

    list.innerHTML =
      "Gagal memuat outlet: " +
      error.message;

    return;
  }

  list.innerHTML = "";

  select.innerHTML =
    '<option value="">Pilih outlet</option>';

  if (!data || data.length === 0) {

    list.innerHTML =
      "Belum ada outlet.";

    return;
  }

  data.forEach(outlet => {

    const item =
      document.createElement("div");

    item.className = "item";

    item.innerHTML = `
      <strong>${escapeHtml(outlet.name)}</strong><br>
      ${escapeHtml(outlet.address || "")}<br>
      ${escapeHtml(outlet.phone || "")}
    `;

    list.appendChild(item);


    const option =
      document.createElement("option");

    option.value = outlet.id;

    option.textContent =
      outlet.name;

    select.appendChild(option);

  });
}


// =========================
// TAMBAH MENU
// =========================

async function addMenu() {

  const outletId =
    document.getElementById("menuOutlet").value;

  const name =
    document.getElementById("menuName").value;

  const price =
    document.getElementById("menuPrice").value;

  const description =
    document.getElementById("menuDescription").value;

  const imageInput =
    document.getElementById("menuImage");

  const message =
    document.getElementById("menuMessage");


  if (!outletId) {
    message.innerHTML =
      "Pilih outlet terlebih dahulu.";
    return;
  }

  if (!name) {
    message.innerHTML =
      "Nama menu wajib diisi.";
    return;
  }

  if (!price) {
    message.innerHTML =
      "Harga wajib diisi.";
    return;
  }


  message.innerHTML =
    "Menyimpan menu...";


  // SIMPAN MENU
  const {
    data: menuData,
    error: menuError
  } = await db
    .from("menus")
    .insert({
      outlet_id: outletId,
      name: name,
      price: Number(price),
      description: description,
      is_available: true
    })
    .select()
    .single();


  if (menuError) {

    message.innerHTML =
      "Gagal menyimpan menu: " +
      menuError.message;

    return;
  }


  // =========================
  // UPLOAD FOTO
  // =========================

  const file =
    imageInput.files[0];


  if (file) {

    message.innerHTML =
      "Menu tersimpan. Mengupload foto...";


    const safeFileName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );

    const filePath =
      menuData.id +
      "/" +
      Date.now() +
      "-" +
      safeFileName;


    const {
      error: uploadError
    } = await db
      .storage
      .from("menu-images")
      .upload(
        filePath,
        file
      );


    if (uploadError) {

      message.innerHTML =
        "Menu berhasil dibuat, tetapi foto gagal diupload: " +
        uploadError.message;

      loadMenus();

      return;
    }


    // SIMPAN PATH FOTO
    const {
      error: photoError
    } = await db
      .from("menu_photos")
      .insert({
        menu_id: menuData.id,
        image_url: filePath,
        sort_order: 0
      });


    if (photoError) {

      message.innerHTML =
        "Foto berhasil diupload, tetapi data foto gagal disimpan: " +
        photoError.message;

      loadMenus();

      return;
    }
  }


  message.innerHTML =
    "Menu dan foto berhasil disimpan.";

  document.getElementById("menuName").value = "";
  document.getElementById("menuPrice").value = "";
  document.getElementById("menuDescription").value = "";
  document.getElementById("menuImage").value = "";

  loadMenus();
}


// =========================
// LOAD MENU
// =========================

async function loadMenus() {

  const {
    data,
    error
  } = await db
    .from("menus")
    .select(`
      *,
      menu_photos (
        id,
        image_url,
        sort_order
      )
    `)
    .order("created_at", {
      ascending: false
    });


  const list =
    document.getElementById("menuList");


  if (error) {

    list.innerHTML =
      "Gagal memuat menu: " +
      error.message;

    return;
  }


  list.innerHTML = "";


  if (!data || data.length === 0) {

    list.innerHTML =
      "Belum ada menu.";

    return;
  }


  data.forEach(menu => {

    const item =
      document.createElement("div");

    item.className = "item";


    let photoText =
      "Belum ada foto";


    if (
      menu.menu_photos &&
      menu.menu_photos.length > 0
    ) {

      photoText =
        "📷 Foto tersimpan";
    }


    item.innerHTML = `
      <strong>${escapeHtml(menu.name)}</strong><br>
      Harga: Rp ${Number(menu.price).toLocaleString("id-ID")}<br>
      ${escapeHtml(menu.description || "")}<br>
      <small>${photoText}</small>
    `;


    list.appendChild(item);

  });
}


// =========================
// ESCAPE HTML
// =========================

function escapeHtml(text) {

  if (!text) return "";

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


// JALANKAN
checkSession();

</script>

</body>
</html>
