<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoGas Menu Manager</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 0 0 20px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      opacity: .8;
    }

    main {
      padding: 18px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      margin-top: 8px;
    }

    #status {
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      margin-bottom: 14px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>GoGas Menu Manager</h1>
    <p>Kelola outlet dan menu dengan mudah</p>
  </header>

  <main>

    <div id="status">
      Menghubungkan ke GoGas...
    </div>

    <div class="card">
      <h2>🏪 Outlet</h2>
      <p>Kelola outlet GoGas kamu.</p>
      <button>Kelola Outlet</button>
    </div>

    <div class="card">
      <h2>🍔 Menu</h2>
      <p>Tambah, edit, dan atur ketersediaan menu.</p>
      <button>Kelola Menu</button>
    </div>

    <div class="card">
      <h2>📷 Foto Menu</h2>
      <p>Upload foto makanan langsung dari HP.</p>
      <button>Upload Foto</button>
    </div>

    <div class="card">
      <h2>📊 Ringkasan</h2>
      <p>Outlet: Belum diatur</p>
      <p>Jumlah Menu: 0</p>
      <p>Menu Aktif: 0</p>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://kigawlittgslscbnmngq.supabase.co";

    const SUPABASE_KEY = "sb_publishable_kSluzLhdTM_CVj5A9PAIvA_oJqKFK8G";

    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    document.getElementById("status").textContent =
      "✅ Terhubung ke server GoGas";
  </script>

</body>
</html>
