<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoGas Menu Manager</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      border-radius: 0 0 20px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      opacity: .8;
    }

    main {
      padding: 18px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 14px;
      border-radius: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    h2 { margin-top: 0; }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      margin-top: 8px;
    }

    .hidden { display: none; }

    #status {
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      margin-bottom: 14px;
      font-size: 14px;
    }

    .outlet {
      padding: 14px;
      background: #f3f4f6;
      border-radius: 12px;
      margin-top: 10px;
    }

    .open {
      color: green;
      font-weight: bold;
    }

    .closed {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>GoGas Menu Manager</h1>
  <p>Kelola outlet dan menu GoGas</p>
</header>

<main>

  <div id="status">Memuat...</div>

  <div id="loginBox" class="card">
    <h2>🔐 Login Admin</h2>

    <input type="email" id="email" placeholder="Email">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>
  </div>

  <div id="dashboard" class="hidden">

    <div class="card">
      <h2>🏪 Outlet</h2>

      <div id="outletList">
        Memuat outlet...
      </div>
    </div>

    <div class="card">
      <h2>🍔 Menu</h2>
      <p>Kelola menu makanan dan minuman.</p>
      <button>Kelola Menu</button>
    </div>

    <div class="card">
      <h2>📷 Foto Menu</h2>
      <p>Upload foto makanan dari HP.</p>
      <button>Upload Foto</button>
    </div>

    <div class="card">
      <h2>📊 Ringkasan</h2>
      <p id="summary">Memuat data...</p>
    </div>

    <button onclick="logout()">Keluar</button>

  </div>

</main>

<script>
  const SUPABASE_URL =
    "https://kigawlittgslscbnmngq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_kSluzLhdTM_CVj5A9PAIvA_oJqKFK8G";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const MERCHANT_ID =
    "01b6caa0-e1bb-49d5-906b-68bd2fb1b58a";

  async function login() {
    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const status =
      document.getElementById("status");

    if (!email || !password) {
      status.textContent =
        "⚠️ Email dan password harus diisi.";
      return;
    }

    status.textContent = "Sedang login...";

    const { error } =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      status.textContent =
        "❌ Login gagal: " + error.message;
      return;
    }

    status.textContent =
      "✅ Login berhasil.";

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("dashboard")
      .classList.remove("hidden");

    loadOutlets();
  }

  async function loadOutlets() {

    const outletList =
      document.getElementById("outletList");

    outletList.textContent =
      "Memuat outlet...";

    const { data, error } =
      await db
        .from("outlets")
        .select("*")
        .eq("merchant_id", MERCHANT_ID)
        .order("created_at", {
          ascending: false
        });

    if (error) {
      outletList.textContent =
        "❌ Gagal mengambil outlet: " +
        error.message;
      return;
    }

    if (!data || data.length === 0) {
      outletList.textContent =
        "Belum ada outlet.";
      return;
    }

    outletList.innerHTML = "";

    data.forEach(function(outlet) {

      const item =
        document.createElement("div");

      item.className = "outlet";

      const status =
        outlet.is_open
          ? '<span class="open">● Buka</span>'
          : '<span class="closed">● Tutup</span>';

      item.innerHTML =
        "<strong>🏪 " +
        outlet.name +
        "</strong>" +
        "<br>" +
        outlet.address +
        "<br>" +
        "📞 " +
        outlet.phone +
        "<br>" +
        status;

      outletList.appendChild(item);
    });

    document.getElementById("summary").textContent =
      "Jumlah outlet: " + data.length;
  }

  async function logout() {

    await db.auth.signOut();

    document
      .getElementById("dashboard")
      .classList.add("hidden");

    document
      .getElementById("loginBox")
      .classList.remove("hidden");

    document.getElementById("status").textContent =
      "Anda sudah keluar.";
  }

  db.auth.getSession().then(function(result) {

    if (result.data.session) {

      document
        .getElementById("loginBox")
        .classList.add("hidden");

      document
        .getElementById("dashboard")
        .classList.remove("hidden");

      document.getElementById("status").textContent =
        "✅ Anda sudah login.";

      loadOutlets();

    } else {

      document.getElementById("status").textContent =
        "Silakan login untuk melanjutkan.";
    }
  });
</script>

</body>
</html>
